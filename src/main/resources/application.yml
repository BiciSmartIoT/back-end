spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:bikelab}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:2005}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
server:
  address: 0.0.0.0
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs
security:
  jwt:
    secret: ${JWT_SECRET:Ma+cOaNdrJ1ZO2uv5MZeP9vme9PvJWop2k4B4ijowso=}
    issuer: ${JWT_ISSUER:BiceSmartIoT}
    expiration: ${JWT_EXPIRATION:3600}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://front-end-ashy-seven-51.vercel.app,https://*.vercel.app,https://front-end-1c8.pages.dev,https://*.front-end-1c8.pages.dev}
  gateway:
    key: ${GATEWAY_INTERNAL_KEY:dev-gateway-key}
logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
